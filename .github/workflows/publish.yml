# Each language posts to YouTube once a day and to Instagram twice a day, at the times in SLOTS (scripts/publish.ts):
#   ID: Instagram 11:47 and 19:19 WIB, YouTube 19:17 WIB. EN: YouTube 12:23, Instagram 12:25 and 17:25 New York.
# GitHub starts scheduled runs late or drops them, so this runs every hour and posts whatever is due today (catching up
# missed slots). A slot is posted at the first hourly run after its time.
name: publish
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      lang:
        description: en or id
        default: en
      only:
        description: youtube, instagram, or empty for both
        default: ''
      dry_run:
        type: boolean
        default: true
concurrency: publish-${{ github.event_name }}-${{ inputs.lang }}
permissions:
  contents: write
jobs:
  publish:
    # Posts on schedule, publicly. To pause the schedule set the repo variable POSTING=off; manual runs always work.
    if: github.event_name == 'workflow_dispatch' || vars.POSTING != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ./.github/actions/setup
      - run: |
          if [ -n "$SCHEDULE" ]; then
            status=0
            for l in id en; do node scripts/publish.ts --lang "$l" --due || status=1; done
            exit $status
          fi
          node scripts/publish.ts --lang "$POST_LANG" ${ONLY:+--only "$ONLY"} $DRY
        env:
          SCHEDULE: ${{ github.event.schedule }}
          ONLY: ${{ inputs.only }}
          POST_LANG: ${{ inputs.lang || 'en' }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
          PRIVACY: ${{ vars.PRIVACY || 'public' }}
          GH_TOKEN: ${{ github.token }} # to download the reviewed render from the videos release
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
          YT_REFRESH_TOKEN_ID: ${{ secrets.YT_REFRESH_TOKEN_ID }}
          IG_USER_ID_EN: ${{ secrets.IG_USER_ID_EN }}
          IG_USER_ID_ID: ${{ secrets.IG_USER_ID_ID }}
          IG_TOKEN_EN: ${{ secrets.IG_TOKEN_EN }}
          IG_TOKEN_ID: ${{ secrets.IG_TOKEN_ID }}
      - name: Save what was posted
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Another run may have saved meanwhile: start from main each try and add this run's records to it.
          cp state/posted.json /tmp/mine.json
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            node scripts/publish.ts --merge-into state/posted.json /tmp/mine.json
            git add state/posted.json
            git diff --cached --quiet && exit 0
            git commit -qm "Posted $(date -u +%F)" && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
