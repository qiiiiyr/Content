# Each language posts to YouTube once a day and to Instagram twice a day. Times (UTC -> local):
#   ID: Instagram 04:47 (11:47 WIB), YouTube 12:17 + Instagram 12:19 (19:17 WIB)
#   EN: YouTube 17:23 + Instagram 17:25 (12:23 New York), Instagram 23:53 (18:53 New York)
# Two runs a couple of minutes apart simply queue (concurrency below); never schedule three close together.
name: publish
on:
  schedule:
    - cron: '47 4 * * *'
    - cron: '17 12 * * *'
    - cron: '19 12 * * *'
    - cron: '23 17 * * *'
    - cron: '25 17 * * *'
    - cron: '53 23 * * *'
  workflow_dispatch:
    inputs:
      lang:
        description: en or id
        default: en
      only:
        description: youtube, instagram, or empty for both
        default: ''
      dry_run:
        type: boolean
        default: true
concurrency: publish
permissions:
  contents: write
jobs:
  publish:
    # Posts on schedule, publicly. To pause the schedule set the repo variable POSTING=off; manual runs always work.
    if: github.event_name == 'workflow_dispatch' || vars.POSTING != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ./.github/actions/setup
      - run: |
          case "$SCHEDULE" in
            '47 4 * * *' | '19 12 * * *') set -- --lang id --only instagram ;;
            '17 12 * * *') set -- --lang id --only youtube ;;
            '23 17 * * *') set -- --lang en --only youtube ;;
            '25 17 * * *' | '53 23 * * *') set -- --lang en --only instagram ;;
            *) set -- --lang "$POST_LANG" ${ONLY:+--only "$ONLY"} ;;
          esac
          node scripts/publish.ts "$@" $DRY
        env:
          SCHEDULE: ${{ github.event.schedule }}
          ONLY: ${{ inputs.only }}
          POST_LANG: ${{ inputs.lang || 'en' }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
          PRIVACY: ${{ vars.PRIVACY || 'public' }}
          GH_TOKEN: ${{ github.token }} # to download the reviewed render from the videos release
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
          YT_REFRESH_TOKEN_ID: ${{ secrets.YT_REFRESH_TOKEN_ID }}
          IG_USER_ID_EN: ${{ secrets.IG_USER_ID_EN }}
          IG_USER_ID_ID: ${{ secrets.IG_USER_ID_ID }}
          IG_TOKEN_EN: ${{ secrets.IG_TOKEN_EN }}
          IG_TOKEN_ID: ${{ secrets.IG_TOKEN_ID }}
      - name: Save what was posted
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/posted.json
          git diff --cached --quiet && exit 0
          git commit -m "Posted $(date -u +%F)"
          for i in 1 2 3 4; do git pull --rebase -q && git push && exit 0; sleep $((i * 5)); done; exit 1
