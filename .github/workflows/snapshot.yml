# Daily, after both posts: subscribers/followers and per-video numbers for YouTube and Instagram -> data/snapshot.json
# (the dashboard reads this file). A red run means one of the 4 logins needs fixing; the other accounts still update.
name: snapshot
on:
  schedule:
    - cron: '30 23 * * *' # 06:30 WIB, after the 19:17 WIB and 12:23 New York posts
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/snapshot.ts
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
          YT_REFRESH_TOKEN_ID: ${{ secrets.YT_REFRESH_TOKEN_ID }}
          IG_USER_ID_EN: ${{ secrets.IG_USER_ID_EN }}
          IG_USER_ID_ID: ${{ secrets.IG_USER_ID_ID }}
          IG_TOKEN_EN: ${{ secrets.IG_TOKEN_EN }}
          IG_TOKEN_ID: ${{ secrets.IG_TOKEN_ID }}
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          git diff --cached --quiet && exit 0
          git commit -m "Stats snapshot $(date -u +%F)"
          for i in 1 2 3 4; do git pull --rebase -q && git push && exit 0; sleep $((i * 5)); done; exit 1
