# Manual: study reference videos (YouTube or Instagram links) for the look of our 3D. Downloads each one, saves a sheet
# of 12 frames, a strip of the first 3 seconds (the hook) and its public numbers, in the `references` release for Claude to view.
name: reference videos
on:
  workflow_dispatch:
    inputs:
      urls:
        description: links separated by spaces
        required: true
permissions:
  contents: write # to save the frames in a release
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q yt-dlp && (command -v ffmpeg || sudo apt-get install -y -qq ffmpeg >/dev/null)
        timeout-minutes: 10
      - env:
          URLS: ${{ inputs.urls }} # passed as data, never pasted into the script
        run: |
          mkdir out; n=0
          for u in $URLS; do
            n=$((n + 1))
            if ! [[ "$u" =~ ^https://(www\.)?(youtube\.com|youtu\.be|instagram\.com)/ ]]; then echo "skipped (not YouTube/Instagram): $u"; continue; fi
            yt-dlp -q --no-playlist -f 'b[height<=1280]/b' -o "out/ref-$n.%(ext)s" --write-info-json -- "$u" || { echo "download failed: $u"; continue; }
            f=$(ls out/ref-$n.* | grep -v json | head -1)
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
            ffmpeg -v error -y -i "$f" -vf "fps=12/$d,scale=270:-1,tile=6x2" -frames:v 1 "out/ref-$n-sheet.png"
            ffmpeg -v error -y -t 3 -i "$f" -vf "fps=2,scale=270:-1,tile=6x1" -frames:v 1 "out/ref-$n-hook.png"
            jq '{url: .webpage_url, uploader, title, duration, view_count, like_count, comment_count, description}' "out/ref-$n.info.json" > "out/ref-$n.json"
            rm -f "$f" "out/ref-$n.info.json"
          done
          ls -la out
      # Saved in the `references` release (replaced on each run), which Claude's session can download.
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release view references -R "$REPO" >/dev/null 2>&1 || gh release create references -R "$REPO" --title "Reference frames" --notes "Frame sheets of reference videos, from the reference videos workflow." || true
          gh release upload references out/* -R "$REPO" --clobber
