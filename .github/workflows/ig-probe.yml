# Manual, debugging only: upload test files to one Instagram account WITHOUT publishing, to see why uploads are refused.
name: instagram upload test
on:
  workflow_dispatch:
    inputs:
      lang:
        description: account (en or id)
        default: id
      files:
        description: video file names in the videos release, separated by spaces
        default: 2026-W48__1-turbo.id.mp4 2026-W48__1-turbo.en.mp4
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FILES: ${{ inputs.files }} # passed as data, never pasted into the script
          PROBE_LANG: ${{ inputs.lang }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IG_USER_ID_EN: ${{ secrets.IG_USER_ID_EN }}
          IG_TOKEN_EN: ${{ secrets.IG_TOKEN_EN }}
          IG_USER_ID_ID: ${{ secrets.IG_USER_ID_ID }}
          IG_TOKEN_ID: ${{ secrets.IG_TOKEN_ID }}
        run: |
          set -eu
          mkdir -p out
          list=""
          for f in $FILES; do
            [[ "$f" =~ ^[A-Za-z0-9._-]+\.mp4$ ]] || { echo "skipped: $f"; continue; }
            gh release download videos -R "$REPO" -p "$f" -D out --clobber
            list="$list out/$f"
          done
          # Also a fresh re-encode of the first file at Instagram's recommended 1080x1920, to rule the encoding in or out.
          first=$(echo $list | cut -d' ' -f1)
          if command -v ffmpeg >/dev/null; then
            ffmpeg -v error -y -i "$first" -vf scale=1080:1920 -c:v libx264 -profile:v high -pix_fmt yuv420p -r 30 -crf 20 -c:a aac -ar 44100 -b:a 128k -movflags +faststart out/reencoded.mp4
            list="$list out/reencoded.mp4"
          fi
          node scripts/ig-probe.ts --lang "$PROBE_LANG" $list
