# On the weekly batch pull request: validate, render every new or changed episode (one parallel job per episode and
# language, since a 3D render takes 30+ minutes), save each video in the `videos` release (the daily post uses it),
# then post the preview links. A change to src/ alone (the look of
# every episode) renders the newest episode so the change can be seen.
name: render previews
on:
  pull_request:
    paths: ['episodes/**', 'src/**']
# A newer push replaces the running previews, so two runs never fight over the same release.
concurrency:
  group: render-${{ github.event.number }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
jobs:
  plan:
    # The repo is public: pull requests from strangers' forks get no renders (no free CI, no code run on our behalf).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: ids
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          ids=$(echo "$changed" | grep '^episodes/' | cut -d/ -f2,3 | sort -u | while read -r id; do if [ -f "episodes/$id/meta.json" ]; then echo "$id"; fi; done)
          if echo "$changed" | grep -q '^src/'; then ids=$(printf '%s\n%s\n' "$ids" "$(ls -d episodes/*/*/ | sed 's#^episodes/##; s#/$##' | tail -1)"); fi
          echo "ids=$(echo "$ids" | grep . | sort -u | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
  test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm test
  render:
    needs: [plan, test]
    if: needs.plan.outputs.ids != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJson(needs.plan.outputs.ids) }}
        lang: [en, id]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: node scripts/build.ts "$ID" "$EP_LANG"
        env:
          ID: ${{ matrix.id }} # from folder names in the PR: passed as data, never pasted into the script
          EP_LANG: ${{ matrix.lang }}
      # Kept in one release, `videos`: the daily post downloads the exact file you reviewed instead of rendering again.
      - name: Save the render
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release view videos -R "$REPO" >/dev/null 2>&1 || gh release create videos -R "$REPO" --title "Rendered episodes" --notes "Renders from the weekly preview workflow. The daily post downloads its video from here." || true
          gh release upload videos out/*.mp4 -R "$REPO" --clobber
          # A small copy (480 px, a few MB) for watching inside the dashboard review.
          mkdir -p out/small && for f in out/*.mp4; do ffmpeg -v error -y -i "$f" -vf scale=480:-2 -c:v libx264 -crf 30 -preset veryfast -c:a aac -b:a 64k -movflags +faststart "out/small/$(basename "$f")"; done
          gh release view previews -R "$REPO" >/dev/null 2>&1 || gh release create previews -R "$REPO" --title "Review previews" --notes "Small copies of the renders, shown in the dashboard review." || true
          gh release upload previews out/small/*.mp4 -R "$REPO" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ strategy.job-index }}
          path: out/*.mp4
          retention-days: 7
  comment:
    needs: render
    if: always() && needs.render.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: preview-*
          merge-multiple: true
          path: out
      - name: Comment preview links
        if: hashFiles('out/*.mp4') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          { echo "### Preview videos (these exact files are what gets posted)"; for f in out/*.mp4; do n=$(basename "$f"); echo "- [$n](https://github.com/$REPO/releases/download/videos/$n)"; done; } > comment.md
          gh pr comment "$PR" -R "$REPO" --body-file comment.md
