# On the weekly batch pull request: validate, render every new or changed episode, post preview links.
name: render previews
on:
  pull_request:
    paths: ['episodes/**', 'src/**']
permissions:
  contents: write
  pull-requests: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: npm test
      - name: Render changed episodes
        run: |
          for id in $(git diff --name-only "origin/$BASE_REF...HEAD" -- episodes | cut -d/ -f2,3 | sort -u); do
            if [ -f "episodes/$id/meta.json" ]; then node scripts/build.ts "$id"; fi
          done
        env:
          BASE_REF: ${{ github.base_ref }}
      - name: Upload previews and comment links
        if: hashFiles('out/*.mp4') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          tag="preview-pr-$PR"
          gh release delete "$tag" -y --cleanup-tag || true
          gh release create "$tag" out/*.mp4 --prerelease --title "Preview for PR #$PR" --notes "Preview renders, not published. Deleted when the PR is merged."
          { echo "### Preview videos"; for f in out/*.mp4; do n=$(basename "$f"); echo "- [$n](https://github.com/$REPO/releases/download/$tag/$n)"; done; } > comment.md
          gh pr comment "$PR" --body-file comment.md
