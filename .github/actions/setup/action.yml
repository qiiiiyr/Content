name: Setup render toolchain
description: Node, the voiceover tool and ffmpeg
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - shell: bash
      run: |
        npm ci
        pip install edge-tts==7.3.1
        sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
